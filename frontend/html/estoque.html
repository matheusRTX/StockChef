<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/estoque.css">
    <title>StockChef - Estoque</title>
</head>

<body>



    <div class="cabecalho">
        <div class="cabecalho1">
            <h1>Estoque</h1>
            <div class="cabecalho-acoes">
                <button class="btn-novo btn-novo-secundario" id="btnNovaCategoria">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    Categoria
                </button>
                <button class="btn-novo" id="btnNovoItem">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    Novo
                </button>
            </div>
        </div>

        <div class="controles">
            <div class="pesquisa">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" placeholder="Buscar item...">
            </div>
            <div class="filtro-wrap">
                <button class="filtro-select" id="filtroBtn">
                    <span id="filtroLabel">Todos</span>
                    <svg class="filtro-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </button>
                <div class="filtro-menu" id="filtroMenu">
                    <button class="filtro-opcao ativo" data-value="Todos">Todos</button>
                </div>
            </div>
        </div>

        <div class="lista" id="listaEstoque">
            <p id="estoqueVazio" style="display:none; color: var(--texto-secundario);">
                Nenhum produto cadastrado ainda.
            </p>
        </div>
    </div>

    <!-- Modal: Novo Item -->
    <div class="modal-overlay" id="modalItemOverlay">
        <div class="modal">
            <div class="modal-cabecalho">
                <h2>Novo Item</h2>
                <button class="modal-fechar" id="fecharModalItem" type="button" aria-label="Fechar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <line x1="6" y1="6" x2="18" y2="18" />
                        <line x1="18" y1="6" x2="6" y2="18" />
                    </svg>
                </button>
            </div>

            <form class="modal-corpo" id="formNovoItem">
                <div class="campo">
                    <label for="inputNomeItem">Nome</label>
                    <input type="text" id="inputNomeItem" name="nome" placeholder="Ex: Tomate" required>
                </div>

                <div class="campo-linha">
                    <div class="campo">
                        <label for="selectCategoriaItem">Categoria</label>
                        <select id="selectCategoriaItem" name="id_categoria" required>
                            <option value="" disabled selected>Selecione</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="selectUnidadeItem">Unidade</label>
                        <select id="selectUnidadeItem" name="id_unidade" required>
                            <option value="" disabled selected>Selecione</option>
                        </select>
                    </div>
                </div>

                <div class="campo">
                    <label for="inputQtdMinimaItem">Quantidade Mínima</label>
                    <input type="number" id="inputQtdMinimaItem" name="estoque_minimo" min="0" step="any" value="0">
                </div>

                <p class="feedback" id="feedbackModalItem"></p>

                <div class="modal-rodape">
                    <button type="submit" class="btn-salvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Nova Categoria -->
    <div class="modal-overlay" id="modalCategoriaOverlay">
        <div class="modal">
            <div class="modal-cabecalho">
                <h2>Nova Categoria</h2>
                <button class="modal-fechar" id="fecharModalCategoria" type="button" aria-label="Fechar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <line x1="6" y1="6" x2="18" y2="18" />
                        <line x1="18" y1="6" x2="6" y2="18" />
                    </svg>
                </button>
            </div>

            <form class="modal-corpo" id="formNovaCategoria">
                <div class="campo">
                    <label for="inputNomeCategoria">Nome</label>
                    <input type="text" id="inputNomeCategoria" name="nome" placeholder="Ex: Bebidas" required>
                </div>

                <div class="campo">
                    <label for="inputDescricaoCategoria">Descrição</label>
                    <textarea id="inputDescricaoCategoria" name="descricao" rows="3"
                        placeholder="Ex: Itens líquidos e bebidas em geral"></textarea>
                </div>

                <p class="feedback" id="feedbackModalCategoria"></p>

                <div class="modal-rodape">
                    <button type="submit" class="btn-salvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- menu -->
    <div class="navegacao-inferior">
        <button id="esquerda">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-house-icon lucide-house">
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                <path
                    d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            </svg>
            <a class="item-nav" href="/inicio">Início</a>
        </button>

        <button id="esp1">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-archive-icon lucide-archive">
                <rect width="20" height="5" x="2" y="3" rx="1" />
                <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" />
                <path d="M10 12h4" />
            </svg>
            <a class="item-nav" href="/estoque">Estoque</a>
        </button>

        <button id="esp2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-qr-code-icon lucide-qr-code">
                <rect width="5" height="5" x="3" y="3" rx="1" />
                <rect width="5" height="5" x="16" y="3" rx="1" />
                <rect width="5" height="5" x="3" y="16" rx="1" />
                <path d="M21 16h-3a2 2 0 0 0-2 2v3" />
                <path d="M21 21v.01" />
                <path d="M12 7v3a2 2 0 0 1-2 2H7" />
                <path d="M3 12h.01" />
                <path d="M12 3h.01" />
                <path d="M12 16v.01" />
                <path d="M16 12h1" />
                <path d="M21 12v.01" />
                <path d="M12 21v-1" />
            </svg>
            <a class="item-nav" href="/qrcode">QR Code</a>
        </button>

        <button id="esp3">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-shopping-cart-icon lucide-shopping-cart">
                <circle cx="8" cy="21" r="1" />
                <circle cx="19" cy="21" r="1" />
                <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
            </svg>
            <a class="item-nav" href="/compras">Compras</a>
        </button>

        <button id="esp4">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-cooking-pot-icon lucide-cooking-pot">
                <path d="M2 12h20" />
                <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" />
                <path d="m4 8 16-4" />
                <path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8" />
            </svg>
            <a class="item-nav" href="/pratos">Pratos</a>
        </button>

        <button id="esp4">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-book-text-icon lucide-book-text">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20" />
                <path d="M8 11h8" />
                <path d="M8 7h6" />
            </svg>
            <a class="item-nav" href="/cardapio">Cardapio</a>
        </button>

        <button id="direita">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-clock-icon lucide-clock">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 6v6l4 2" />
            </svg>
            <a class="item-nav" href="#">Histórico</a>
        </button>

    </div>


<script src="/static/js/estoque.js"></script>

</body>

</html>

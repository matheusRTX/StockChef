<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Compras</title>
    <link rel="stylesheet" href="/static/css/compras.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
    <div class="aplicativo">

        <div class="container">

            <div id="dados">

                <!-- cabeçalho -->
                <div class="cabecalho">
                    <div id="btn-fornecedores">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users-icon lucide-users"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>
                        <h4>fornecedores</h4>
                    </div>
                </div>

                <!-- btn (gerar lista de compras) -->
                <button id="btn-copiar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-copy-icon lucide-copy">
                        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                    </svg>
                    <p>Copiar Lista</p>
                </button>

                <div id="compartilhar">
                    <button id="btn-pdf" class="generico">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-download-icon lucide-download">
                            <path d="M12 15V3" />
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <path d="m7 10 5 5 5-5" />
                        </svg>
                        <p>PDF</p>
                    </button>

                    <button id="btn-imprimir" class="generico">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-printer-icon lucide-printer">
                            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                            <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6" />
                            <rect x="6" y="14" width="12" height="8" rx="1" />
                        </svg>
                        <p>Imprimir</p>
                    </button>

                    <button id="btn-enviar" class="generico">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-share2-icon lucide-share-2">
                            <circle cx="18" cy="5" r="3" />
                            <circle cx="6" cy="12" r="3" />
                            <circle cx="18" cy="19" r="3" />
                            <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" />
                            <line x1="15.41" x2="8.59" y1="6.51" y2="10.49" />
                        </svg>
                        <p>Enviar</p>
                    </button>
                </div>



                <!-- categorias com produtos abaixo do estoque mínimo (preenchido via JS a partir de /api/estoque/listar) -->
                <div id="lista-categorias"></div>

                <p id="compras-vazio" style="display:none; margin-top: 6%;">
                    Nenhum produto está abaixo do estoque mínimo no momento. 🎉
                </p>














            </div>

            <!-- Modal: Lista de Fornecedores -->
            <div class="modal-overlay" id="modalFornecedoresOverlay">
                <div class="modal">
                    <div class="modal-cabecalho">
                        <h2>Fornecedores</h2>
                        <button class="modal-fechar" id="fecharModalFornecedores" type="button" aria-label="Fechar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <line x1="6" y1="6" x2="18" y2="18" />
                                <line x1="18" y1="6" x2="6" y2="18" />
                            </svg>
                        </button>
                    </div>

                    <div class="modal-corpo">
                        <button type="button" id="btnNovoFornecedor" class="btn-salvar btn-bloco">+ Novo fornecedor</button>

                        <p class="feedback" id="feedbackListaFornecedores"></p>

                        <div id="listaFornecedores" class="lista-fornecedores"></div>

                        <p id="fornecedoresVazio" class="feedback" style="display:none;">
                            Nenhum fornecedor cadastrado ainda.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Modal: Novo / Editar Fornecedor -->
            <div class="modal-overlay" id="modalFornecedorOverlay">
                <div class="modal">
                    <div class="modal-cabecalho">
                        <h2 id="tituloModalFornecedor">Novo fornecedor</h2>
                        <button class="modal-fechar" id="fecharModalFornecedor" type="button" aria-label="Fechar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <line x1="6" y1="6" x2="18" y2="18" />
                                <line x1="18" y1="6" x2="6" y2="18" />
                            </svg>
                        </button>
                    </div>

                    <form class="modal-corpo" id="formFornecedor">
                        <input type="hidden" id="inputIdFornecedor" value="">

                        <div class="campo">
                            <label for="inputNomeFornecedor">Nome</label>
                            <input type="text" id="inputNomeFornecedor" name="nome" placeholder="Ex: Frigorífico Boi Bom" required>
                        </div>

                        <div class="campo">
                            <label for="selectCategoriaFornecedor">Categoria</label>
                            <select id="selectCategoriaFornecedor" name="id_categoria">
                                <option value="">Sem categoria</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="inputTelefoneFornecedor">WhatsApp (com DDI, ex: 5511999998888)</label>
                            <input type="tel" id="inputTelefoneFornecedor" name="telefone" placeholder="5511999998888">
                        </div>

                        <div class="campo">
                            <label for="inputEmailFornecedor">Email</label>
                            <input type="email" id="inputEmailFornecedor" name="email">
                        </div>

                        <p class="feedback" id="feedbackModalFornecedor"></p>

                        <div class="modal-rodape">
                            <button type="submit" class="btn-salvar">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- menu -->
            <div class="navegacao-inferior">
            <a class="item-nav" id="esquerda" href="/inicio">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-house-icon lucide-house">
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                <path
                d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </svg>
                <span>Início</span>
            </a>

            <a class="item-nav" id="esp1" href="/estoque">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-archive-icon lucide-archive">
                <rect width="20" height="5" x="2" y="3" rx="1" />
                <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" />
                <path d="M10 12h4" />
                </svg>
                <span>Estoque</span>
            </a>

            <a class="item-nav" id="esp2" href="/qrcode">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-qr-code-icon lucide-qr-code">
                <rect width="5" height="5" x="3" y="3" rx="1" />
                <rect width="5" height="5" x="16" y="3" rx="1" />
                <rect width="5" height="5" x="3" y="16" rx="1" />
                <path d="M21 16h-3a2 2 0 0 0-2 2v3" />
                <path d="M21 21v.01" />
                <path d="M12 7v3a2 2 0 0 1-2 2H7" />
                <path d="M3 12h.01" />
                <path d="M12 3h.01" />
                <path d="M12 16v.01" />
                <path d="M16 12h1" />
                <path d="M21 12v.01" />
                <path d="M12 21v-1" />
                </svg>
                <span>QR Code</span>
            </a>

            <a class="item-nav" id="esp3" href="/compras">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-shopping-cart-icon lucide-shopping-cart">
                <circle cx="8" cy="21" r="1" />
                <circle cx="19" cy="21" r="1" />
                <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
                </svg>
                <span>Compras</span>
            </a>

            <a class="item-nav" id="esp4" href="/pratos">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-cooking-pot-icon lucide-cooking-pot">
                <path d="M2 12h20" />
                <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" />
                <path d="m4 8 16-4" />
                <path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8" />
                </svg>
                <span>Pratos</span>
            </a>

            <a class="item-nav" id="esp4" href="/cardapio">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-book-text-icon lucide-book-text">
                <path
                d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20" />
                <path d="M8 11h8" />
                <path d="M8 7h6" />
                </svg>
                <span>Cardapio</span>
            </a>

            <a class="item-nav" id="direita" href="/historico">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-clock-icon lucide-clock">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 6v6l4 2" />
                </svg>
                <span>Histórico</span>
            </a>
        </div>

        </div>
        <script src="/static/js/compras.js"></script>
</body>

</html>

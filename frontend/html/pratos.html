<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratos</title>
  <link rel="stylesheet" href="/static/css/pratos.css">
    <link rel="stylesheet" href="/static/css/topo.css">
</head>

<body>

  <div class="aplicativo">

    <div class="container">

      <!-- pesquisa -->
      <div id="pesquisa">
        <div class="card-cardapio">
          <div class="esquerda">
            <svg class="estrela" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M11.48 3.499c.172-.435.744-.435.916 0l2.122 5.36 5.797.408c.467.033.654.606.29.934l-4.342 3.934 1.396 5.719c.113.463-.39.829-.79.596L12 17.25l-5.187 2.966c-.4.233-.903-.133-.79-.596l1.396-5.719-4.342-3.934c-.364-.328-.177-.901.29-.934l5.797-.408 2.122-5.36Z" />
            </svg>

            <div class="card-texto-cardapio">
              <h3 class="tit">Usar cardápio</h3>
              <p class="sub">Só sugere pratos do cardápio. Essenciais sempre aparecem.</p>
            </div>
          </div>

          <label class="switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
        <p id="tipo">Tipo de culinária (opcional)</p>
        <input class="input" placeholder="Ex: Italiana, Brasileira, Japonesa..." />
        <button class="btn-sugerir">Sugerir Pratos com IA</button>
      </div>







      <!-- menu -->
      <div class="navegacao-inferior">
            <a class="item-nav" id="esquerda" href="/inicio">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-house-icon lucide-house">
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                <path
                d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </svg>
                <span>Início</span>
            </a>

            <a class="item-nav" id="esp1" href="/estoque">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-archive-icon lucide-archive">
                <rect width="20" height="5" x="2" y="3" rx="1" />
                <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" />
                <path d="M10 12h4" />
                </svg>
                <span>Estoque</span>
            </a>

            <a class="item-nav" id="esp2" href="/qrcode">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-qr-code-icon lucide-qr-code">
                <rect width="5" height="5" x="3" y="3" rx="1" />
                <rect width="5" height="5" x="16" y="3" rx="1" />
                <rect width="5" height="5" x="3" y="16" rx="1" />
                <path d="M21 16h-3a2 2 0 0 0-2 2v3" />
                <path d="M21 21v.01" />
                <path d="M12 7v3a2 2 0 0 1-2 2H7" />
                <path d="M3 12h.01" />
                <path d="M12 3h.01" />
                <path d="M12 16v.01" />
                <path d="M16 12h1" />
                <path d="M21 12v.01" />
                <path d="M12 21v-1" />
                </svg>
                <span>QR Code</span>
            </a>

            <a class="item-nav" id="esp3" href="/compras">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-shopping-cart-icon lucide-shopping-cart">
                <circle cx="8" cy="21" r="1" />
                <circle cx="19" cy="21" r="1" />
                <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
                </svg>
                <span>Compras</span>
            </a>

            <a class="item-nav ativo" id="esp4" href="/pratos">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-cooking-pot-icon lucide-cooking-pot">
                <path d="M2 12h20" />
                <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" />
                <path d="m4 8 16-4" />
                <path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8" />
                </svg>
                <span>Pratos</span>
            </a>

            <a class="item-nav" id="esp4" href="/cardapio">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-book-text-icon lucide-book-text">
                <path
                d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20" />
                <path d="M8 11h8" />
                <path d="M8 7h6" />
                </svg>
                <span>Cardapio</span>
            </a>

            <a class="item-nav" id="direita" href="/historico">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-clock-icon lucide-clock">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 6v6l4 2" />
                </svg>
                <span>Histórico</span>
            </a>
        </div>

    </div>



<script src="/static/js/pratos.js"></script>
